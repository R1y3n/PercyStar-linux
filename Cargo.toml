[package]
name = "rpf9_explorer"
version = "1.4.3"
edition = "2021"

[[bin]]
name = "PercyStar"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui-wgpu = "0.31"
flate2 = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
rusty-opus = "1.2"
wgpu = "24"
winit = "0.30"
glam = "0.29"
bytemuck = { version = "1.21", features = ["derive"] }
texture2ddecoder = "0.1.2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
