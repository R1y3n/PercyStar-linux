name: Linux Build

on:
  workflow_dispatch:
  push:
    branches:
      - linux-build

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libssl-dev \
            libasound2-dev \
            libudev-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            libfuse2 \
            file \
            desktop-file-utils \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build (release)
        run: cargo build --release --bin PercyStar

      - name: Package tarball
        run: |
          mkdir -p dist
          cp target/release/PercyStar dist/PercyStar
          chmod +x dist/PercyStar
          cp README.md LICENSE dist/ || true
          tar -czf PercyStar-linux-x64.tar.gz -C dist .

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          LINUXDEPLOY_OUTPUT_VERSION: linux
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/release/PercyStar AppDir/usr/bin/PercyStar
          chmod +x AppDir/usr/bin/PercyStar
          cp assets/logo.png AppDir/usr/share/icons/hicolor/256x256/apps/percystar.png
          cp assets/logo.png AppDir/percystar.png
          cat > AppDir/usr/share/applications/percystar.desktop << 'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=PercyStar
          Exec=PercyStar
          Icon=percystar
          Categories=Utility;Development;
          Terminal=false
          DESKTOP
          cp AppDir/usr/share/applications/percystar.desktop AppDir/percystar.desktop

          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-gtk/releases/download/continuous/linuxdeploy-plugin-gtk-x86_64.AppImage -O linuxdeploy-plugin-gtk.AppImage
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-gtk.AppImage
          export PATH="$PWD:$PATH"
          export DEPLOY_GTK_VERSION=3
          file AppDir/usr/bin/PercyStar || true
          ldd AppDir/usr/bin/PercyStar | tail -30 || true
          ./linuxdeploy.AppImage --appdir AppDir --executable AppDir/usr/bin/PercyStar --desktop-file AppDir/usr/share/applications/percystar.desktop --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/percystar.png --plugin gtk --output appimage 2>&1 | tee linuxdeploy.log; rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "--- linuxdeploy failed rc=$rc ---"
            tail -120 linuxdeploy.log || true
            exit $rc
          fi
          ls -la PercyStar*.AppImage
          mv PercyStar*.AppImage PercyStar-linux-x86_64.AppImage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PercyStar-linux-x64
          path: |
            PercyStar-linux-x64.tar.gz
            PercyStar-linux-x86_64.AppImage
          if-no-files-found: error
