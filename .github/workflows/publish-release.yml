name: Publish Linux Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v1.6.0-linux)"
        required: true
        type: string
      run_id:
        description: "Actions run ID containing the PercyStar-linux-x64 artifact"
        required: true
        type: string
      target_sha:
        description: "Commit SHA to release/tag"
        required: true
        type: string
      artifact_name:
        description: "Artifact name"
        required: true
        default: "PercyStar-linux-x64"
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Download the built Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-assets

      - name: Verify assets
        run: |
          set -euo pipefail
          ls -lh release-assets
          test -f release-assets/PercyStar-linux-x64.tar.gz
          test -f release-assets/PercyStar-linux-x86_64.AppImage

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release-assets/PercyStar-linux-x64.tar.gz \
              release-assets/PercyStar-linux-x86_64.AppImage \
              --clobber
          else
            notes=$(mktemp)
            cat > "$notes" <<'NOTES'
          Linux build of upstream PercyStar v1.7.0 with fork-specific build, offline and scanner changes.

          - All upstream commits through v1.7.0 are merged (`behind_by: 0`).
          - Linux x64 binary built on Ubuntu 22.04 (glibc 2.35+).
          - AppImage built with linuxdeploy + appimagetool; GIO module mismatch fixed.
          - GTK3 file dialogs via `rfd`; startup update check and updater UI disabled.
          - Linux video playback without `binkplay.exe`/RAD Video Tools: uses local `mpv`, `ffplay`, VLC or MPlayer (`PERCYSTAR_VIDEO_PLAYER` overrides), plus a native `--inspect-bk2` container report.
          - Model Texture Browser textures are now bound into the rasterizer's material layers and override embedded whole-mesh textures.
          - `--scan` CLI with `--name`, `--type`, `--min-size`, `--max-size`, `--limit`, `--json`.
          - Scanner deduplicates claimed zlib offsets and uses a smaller whole-file threshold for CLI scans.
          - Idle model-viewer raster buffers are released to lower RAM use.
          - Upstream v1.7.0 features included: SGD5 effect browser and native shader metadata, streaming GXT discovery, GXT empty-row preservation, faster Bink playback, BCPack BC1-BC5 textures, smooth filtered renderer with OBJ/MTL/GLB export, and world viewer improvements.

          Assets: `PercyStar-linux-x64.tar.gz` and `PercyStar-linux-x86_64.AppImage`.
          NOTES
            gh release create "$TAG" \
              --title "PercyStar Linux ${TAG}" \
              --notes-file "$notes" \
              --target "$TARGET_SHA" \
              release-assets/PercyStar-linux-x64.tar.gz \
              release-assets/PercyStar-linux-x86_64.AppImage
          fi
          gh release view "$TAG" --json tagName,url,assets
